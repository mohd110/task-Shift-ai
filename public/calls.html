<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Call Logs - Task Shift AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f4f7fb;
  color:#1e293b;
}

.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:white;
  border-right:1px solid #e5e7eb;
  padding:20px;
}
.logo{font-size:20px;font-weight:700;margin-bottom:30px}
.menu a{
  display:block;padding:12px 14px;margin-bottom:8px;
  border-radius:10px;text-decoration:none;color:#334155;font-weight:500;
}
.menu a.active,.menu a:hover{background:#e0f2fe;color:#0284c7}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* HEADER */
.header{
  background:white;border-bottom:1px solid #e5e7eb;
  padding:15px 25px;display:flex;justify-content:space-between;align-items:center;
}
.search{
  width:300px;padding:10px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;
}

/* CONTENT */
.content{padding:24px;overflow:auto}

/* KPI CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;margin-bottom:20px;
}
.card{
  background:white;padding:16px;border-radius:14px;
  box-shadow:0 3px 10px rgba(0,0,0,0.04);
}
.card-title{color:#64748b;font-size:13px}
.card-value{font-size:22px;font-weight:700;margin-top:4px}

/* TABLE */
.tableWrap{
  background:white;border-radius:16px;padding:18px;
  box-shadow:0 3px 10px rgba(0,0,0,0.04);
}

table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:13px;color:#64748b;
  padding:12px 8px;border-bottom:1px solid #e5e7eb;
}
td{
  padding:14px 8px;border-bottom:1px solid #f1f5f9;
}

/* STATUS BADGES */
.badge{
  padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;
}
.scheduled{background:#dcfce7;color:#15803d}
.inquiry{background:#e0f2fe;color:#0369a1}
.handoff{background:#ffedd5;color:#c2410c}
.missed{background:#fee2e2;color:#b91c1c}

/* ACTION BUTTON */
.viewBtn{
  background:#e2e8f0;border:none;border-radius:8px;
  padding:8px 12px;cursor:pointer;font-size:13px;color:#64748b;
  font-weight:500;transition:all 0.2s;
}
.viewBtn:hover{background:#cbd5e1;color:#475569}

/* CALLER CELL */
.callerCell{display:flex;align-items:center;gap:10px}
.callerAvatar{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:white;
}
</style>

</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <div class="sidebar">
    <div class="logo">🤖 Task Shift AI</div>
    <div class="menu">
      <a href="/">Dashboard</a>
      <a class="active" href="/calls.html">Call Logs</a>
      <a href="/calendar.html">Calendar</a>
      <a onclick="logout()">Logout</a>
    </div>
  </div>

  <!-- MAIN -->

  <div class="main">

```
<div class="header">
  <h2>Call Logs History</h2>
  <input class="search" placeholder="Search caller or content..." />
</div>

<div class="content">

  <!-- KPI -->
  <div class="cards">
    <div class="card">
      <div class="card-title">Total Calls</div>
      <div class="card-value" id="totalCalls">--</div>
    </div>

    <div class="card">
      <div class="card-title">Avg Duration</div>
      <div class="card-value">--</div>
    </div>

    <div class="card">
      <div class="card-title">Success Rate</div>
      <div class="card-value">--%</div>
    </div>

    <div class="card">
      <div class="card-title">Total Savings</div>
      <div class="card-value">$--</div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="tableWrap">
    <table>
      <thead>
        <tr>
          <th>Caller</th>
          <th>Date & Time</th>
          <th>Duration</th>
          <th>Outcome</th>
          <th>Transcript Snippet</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="callsTable">
        <tr>
          <td colspan="6" style="text-align:center;color:#94a3b8">Loading call data...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

</div>

<script>
function logout(){
  localStorage.removeItem("loggedIn");
  window.location="login.html";
}
</script>

</body>
</html>
