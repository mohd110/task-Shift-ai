<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calendar - Task Shift AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f4f7fb;
  color:#1e293b;
}
.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
  width:250px;background:white;border-right:1px solid #e5e7eb;padding:20px;
}
.logo{font-size:20px;font-weight:700;margin-bottom:30px}
.menu a{
  display:block;padding:12px 14px;margin-bottom:8px;border-radius:10px;
  text-decoration:none;color:#334155;font-weight:500;
}
.menu a.active,.menu a:hover{background:#e0f2fe;color:#0284c7}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column}

/* HEADER */
.header{
  background:white;border-bottom:1px solid #e5e7eb;
  padding:15px 25px;display:flex;justify-content:space-between;align-items:center;
}

/* CONTENT */
.content{
  padding:20px;
  display:grid;
  grid-template-columns: 1fr 320px;
  gap:20px;
  height:100%;
}

/* CALENDAR PANEL */
.calendarWrap{
  background:white;border-radius:16px;padding:18px;
  box-shadow:0 3px 10px rgba(0,0,0,0.04);
}

/* RIGHT PANEL */
.schedulePanel{
  background:white;border-radius:16px;padding:18px;
  box-shadow:0 3px 10px rgba(0,0,0,0.04);
}

#calendar{margin-top:10px}

.upcoming{
  background:#f1f5f9;padding:12px;border-radius:10px;margin-bottom:12px;
}

button{
  margin-top:10px;padding:10px;border:none;border-radius:8px;
  background:#0284c7;color:white;cursor:pointer;
}
/* ===== FULLCALENDAR SAAS STYLE ===== */

.fc{
font-family:'Inter',sans-serif;
}

/* top toolbar */
.fc .fc-toolbar{
margin-bottom:18px;
}

.fc .fc-toolbar-title{
font-size:22px;
font-weight:600;
color:#1e293b;
}

/* buttons (Month Week Day) */
.fc .fc-button{
background:#eef2f7;
border:none;
color:#475569;
border-radius:8px;
padding:6px 12px;
box-shadow:none;
}

.fc .fc-button-primary:not(:disabled).fc-button-active{
background:#0284c7;
color:white;
}

.fc .fc-button:hover

/* calendar grid */
.fc-theme-standard .fc-scrollgrid{
border:1px solid #e2e8f0;
border-radius:14px;
overflow:hidden;
}

.fc-theme-standard td,
.fc-theme-standard th{
border-color:#e5e7eb;
}

.fc-col-header-cell{
background:#f8fafc;
padding:10px 0;
font-weight:500;
color:#64748b;
}

/* day cells */
.fc-daygrid-day{
background:white;
}

.fc-daygrid-day:hover

/* today highlight */
.fc-day-today{
background:#e0f2fe !important;
}

/* events (booked slots) */
.fc-event{
background:#bfdbfe;
border:none;
color:#1e3a8a;
border-radius:8px;
padding:2px 6px;
font-size:12px;
}

/* time slots (week view) */
.fc-timegrid-slot{
height:48px;
}

.fc-timegrid-axis{
color:#64748b;
}

/* selection highlight */
.fc-highlight{
background:#bae6fd !important;
}

</style>

</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <div class="sidebar">
    <div class="logo">🤖 Task Shift AI</div>
    <div class="menu">
      <a href="/">Dashboard</a>
      <a href="/calls.html">Call Logs</a>
      <a class="active" href="/calendar.html">Calendar</a>
      <a onclick="logout()">Logout</a>
    </div>
  </div>

  <!-- MAIN -->

  <div class="main">

```
<div class="header">
  <h2>Appointment Calendar</h2>

  <div style="display:flex;align-items:center;gap:14px;">
    <input placeholder="Search..." style="
      padding:8px 12px;
      border-radius:8px;
      border:1px solid #e2e8f0;
      background:#f8fafc;
    ">

```
<div style="font-size:18px;">🔔</div>

<button style="
  background:#1d4ed8;
  padding:10px 16px;
  border-radius:10px;
  font-weight:500;
">
  + New Call
</button>
```

  </div>
</div>


<div class="content">

  <!-- CALENDAR -->
  <div class="calendarWrap">
    <div id="calendar"></div>
    <button onclick="confirmBooking()">Confirm Selected Slot</button>
  </div>

  <!-- RIGHT PANEL -->
  <div class="schedulePanel">
    <h3>Today's Schedule</h3>

    <div class="upcoming">
      Client Onboarding<br>
      <small>10:30 AM</small>
    </div>

    <div class="upcoming">
      Consultation<br>
      <small>01:45 PM</small>
    </div>

  </div>

</div>
```

  </div>
</div>

<script src="app.js"></script>

<script>
function logout(){
  localStorage.removeItem("loggedIn");
  window.location="login.html";
}
</script>

</body>
</html>
