<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: #f3f4f6;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

/* Card */
.auth-card{
    width:420px;
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 20px 45px rgba(0,0,0,0.08);
}

/* Logo */
.logo{
    width:42px;
    height:42px;
    background:#2563eb;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:700;
    font-size:20px;
    margin:auto;
    margin-bottom:14px;
}

.title{
    text-align:center;
    font-weight:700;
    font-size:26px;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:30px;
}

/* Inputs */
.form-label{
    font-weight:600;
    font-size:14px;
    color:#374151;
}

.form-control{
    height:48px;
    border-radius:10px;
    border:1px solid #d1d5db;
    padding-left:14px;
}

.form-control:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

/* Button */
.btn-login{
    height:50px;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-weight:600;
    border:none;
    transition:.25s;
}

.btn-login:hover{
    background:#1e4fd8;
}

/* Divider */
.divider{
    text-align:center;
    margin:25px 0;
    color:#9ca3af;
    font-size:14px;
    position:relative;
}

.divider::before,
.divider::after{
    content:"";
    position:absolute;
    top:50%;
    width:40%;
    height:1px;
    background:#e5e7eb;
}

.divider::before{ left:0; }
.divider::after{ right:0; }

/* Google Button */
.google-btn{
    border:1px solid #d1d5db;
    border-radius:12px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-weight:600;
    background:white;
    transition:.25s;
}

.google-btn:hover{
    background:#f9fafb;
}

/* footer */
.footer-text{
    text-align:center;
    margin-top:25px;
    font-size:14px;
}

.footer-text a{
    text-decoration:none;
    font-weight:600;
    color:#2563eb;
}
</style>

</head>

<body>


<div class="auth-card">

    <div class="logo">V</div>

    <div class="title">Welcome back</div>
    <div class="subtitle">Login to your account</div>

    <form onsubmit="return false;">
        
        <div class="mb-3">
            <label class="form-label">Work Email</label>
            <input type="email" id="email" class="form-control" placeholder="name@company.com">
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••">
        </div>

        <div class="d-grid">
            <button onclick="onLogin()" class="btn-login">Login</button>
        </div>

    </form>

    <div class="divider">OR</div>

    <div class="google-btn">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20">
        Sign in with Google
    </div>

    <div class="footer-text">
        Don't have an account?
        <a href="signup.html">Create account</a>
    </div>

</div>

<script>
  //-----Development enviourment------
  function onLogin() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === "hr@company.com" && password === "1234") {
      localStorage.setItem("loggedIn", "true");
      window.location.href = "index.html";
    } else {
      alert("Invalid credentials");
    }
  }

</script>

</body>
</html>
