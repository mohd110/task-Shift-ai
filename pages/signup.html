<!-- =====================================================
     pages/signup.html
     Sign Up screen — included inside index.html
     as <div id="screen-signup" class="screen active">
     ===================================================== -->

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">T</div>
      <div class="auth-logo-text">Task Shift Ai</div>
    </div>
    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Start your 14-day free trial. No credit card required.</div>

    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input class="form-input" type="text" placeholder="John Doe"/>
    </div>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input class="form-input" type="email" placeholder="john@company.com"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" placeholder="Min. 8 characters"/>
    </div>
    <div class="form-group">
      <label class="form-label">Company Name</label>
      <input class="form-input" type="text" placeholder="Your company"/>
    </div>

    <button class="btn btn-primary btn-full" style="margin-bottom:16px"
      onclick="goTo('screen-success')">
      Create Account →
    </button>

    <div class="auth-divider"><span>or continue with</span></div>
    <button class="btn btn-outline btn-full" style="margin-bottom:16px">
      🔵 Continue with Google
    </button>

    <div class="auth-footer">
      Already have an account?
      <a onclick="goTo('screen-login')">Sign in</a>
    </div>
  </div>

  <div style="font-size:12px;color:var(--gray-400)">
    By signing up you agree to our
    <span style="color:var(--blue);cursor:pointer">Terms</span> and
    <span style="color:var(--blue);cursor:pointer">Privacy Policy</span>
  </div>
</div>
