     pages/success.html
     Successful sign-up confirmation screen.
     ===================================================== -->

<div class="auth-wrap">
  <div class="auth-card" style="text-align:center">
    <div class="auth-logo" style="justify-content:center">
      <div class="auth-logo-icon">T</div>
      <div class="auth-logo-text">Task Shit Ai</div>
    </div>
    <div class="success-icon">✓</div>
    <div class="auth-title">Welcome to Task Shit Ai!</div>
    <div class="auth-sub">
      Your account has been created successfully.
      You're ready to set up your AI voice assistant.
    </div>
    <button class="btn btn-primary btn-full" style="margin-bottom:14px"
      onclick="goTo('screen-app')">
      Go to Dashboard →
    </button>
    <button class="btn btn-outline btn-full"
      onclick="goTo('screen-login')">
      Sign in instead
    </button>
  </div>
</div>
